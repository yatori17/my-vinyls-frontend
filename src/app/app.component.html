<app-header></app-header>

<div class="page-container">
  <div class="toolbar">
    <button mat-raised-button color="primary" class="btn-add" (click)="openAddModal()">
      <span class="icon">+</span> Adicionar Disco
    </button>
  </div>

  <app-vinyl-list
  [vinyls]="vinyls()"
  [isLoading]="isLoading()"
  (delete)="deleteVinyl($event)"
  (details)="showDetails($event)"
  (edit)="openEditModal($event)">
</app-vinyl-list>
</div>

<app-footer></app-footer>
